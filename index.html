    <noscript>
      <h1>Aquilon Pitch</h1>
      <p>Mixed-pitch walls on one Aquilon screen.</p>
      <p>Works out the pitch compensation an Analog Way LivePremier needs when one screen spans LED walls of different pixel pitches. Type in each output group's raster and its pitch (or its measured size, and let it work the pitch out), and you get the H and V ratios to type into Web RCS, the canvas footprint each group will take, the screen canvas that comes out of it, and how many millimetres the device's three-decimal field costs you at the far edge of each wall. It all runs in the browser with no account and no backend, so a client's set design has nowhere to leak to.</p>
      <p>Aquilon Pitch runs in the browser and needs JavaScript.</p>
